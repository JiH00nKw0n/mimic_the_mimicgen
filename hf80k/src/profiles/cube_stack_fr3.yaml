# FR3가 큐브 세 개를 탑으로 쌓는 태스크.
#
# 값은 전부 예전에 코드에 상수로 박혀 있던 것을 그대로 옮긴 것이다. 이 프로필을 쓰면
# 파이프라인이 지금까지와 똑같이 동작한다.
schema_version: fr3.hf80k.task_profile.v1
id: cube_stack_fr3

generate:
  # Isaac에 등록되는 태스크 이름. 생성 스크립트에 --task로 넘어간다.
  task_id: Isaac-Stack-Cube-LabFR3-HF80K-Fwd-IK-Rel-Mimic-v0
  # 생성 스크립트에 import 한 줄로 끼워 넣을 모듈들. 순서가 중요하다.
  register_modules: [lab_register, clean_success_hook, provenance_hooks]
  # 위 모듈이 들어 있는 디렉터리. src 아래의 상대 경로다.
  module_dir: env
  # 구간 경계 표시가 붙은 소스 데모. assets 아래의 상대 경로다.
  source_hdf5: fwd_annotated.hdf5
  source_yield_json: source_yield.json
  arm_scale: "0.5"
  subtask_offsets: "10,20"
  # 이 태스크에는 sart 절이 없다. 일부러 없는 것이다. SART 증강은 태스크 프로필이
  # 켜 줄 때만 도는 선택 단계이고, 큐브 쌓기는 돌지 않는다. 빈 절이라도 적어 두면
  # 실행 전 검사가 "SART를 켰는데 설정이 없다"로 판단해 실행을 막는다.
  extra_env: {}

  # 소스 시연을 고르는 방식. 기본으로 켜져 있고 환경변수 HEURISTIC_SELECTION=0으로 끈다.
  # 세 가지를 한다.
  #
  # 첫째, 하위 작업마다 소스를 다시 고른다. 하위 작업이란 한 시연을 집기와 꽂기처럼 의미
  # 있는 구간으로 자른 단위다. 설치된 생성기는 스위치 하나만 켜면 첫 하위 작업의 선택이
  # 나머지로 그대로 물려지므로 짝이 되는 스위치까지 함께 켠다.
  #
  # 둘째, 거리가 같은 후보를 번호 순서 대신 무작위로 고른다. 최근접 이웃 선택은 새 물체
  # 자세와 각 시연의 첫 물체 자세 사이 거리로 후보를 줄 세우는데, 시연을 모두 같은 배치에서
  # 녹화하면 그 거리가 완전히 같아진다. 정렬이 동점을 번호 순서로 놓으므로 뒤쪽 시연은
  # 뽑힐 확률이 낮은 것이 아니라 정확히 0이 된다.
  #
  # 셋째, 반복해서 성공이 없는 (하위 작업, 소스) 짝만 그 하위 작업에서 뺀다. 시연 한 편이
  # 어느 하위 작업에서 실패했다고 그 편을 전체에서 지우지 않는다.
  heuristic_selection:
    enable: true
    per_subtask: true
    tie_break: shuffle
    # {하위 작업 번호: [뺄 소스 번호]}. 이 번호는 assets/fwd_annotated.hdf5에서
    # SOURCE_DEMO_FILTER가 걸러 만든 12편짜리 사본 안의 순서에만 유효하다. 시연을 더
    # 녹화하거나 거르는 설정을 바꾸면 번호가 밀리므로 반드시 다시 재야 한다.
    # tools/source_routing_report.py에 생성 기록을 넣으면 이 꼴 그대로 내놓는다.
    #
    # 아래 값의 근거는 두 가지다.
    #
    # 첫째, 각 짝이 평균보다 나쁘다는 증거가 강하다. 이 설정으로 903회를 시도했을 때
    # 전체 성공률이 4.32%였는데, 아래 일곱 짝은 합쳐서 646번 뽑혀 한 번도 성공하지
    # 않았다. 평균대로라면 27.9편이 나왔어야 한다. 구간별로 보면 이렇다.
    #
    #   집기 구간의 시연 2번과 3번        178회에 0편, 기대 7.7편,  우연일 확률 3.9e-04
    #   맨 위 집기 구간의 1번과 7번과 9번  247회에 0편, 기대 10.7편, 우연일 확률 1.8e-05
    #   가운데 올리기 구간의 4번          134회에 0편, 기대 5.8편,  우연일 확률 2.7e-03
    #   맨 위 올리기 구간의 3번            87회에 0편, 기대 3.8편,  우연일 확률 2.2e-02
    #
    # 짝이 48개이므로 본페로니 문턱은 0.001이다. 앞의 두 줄은 그 문턱을 넘고 뒤의 두
    # 줄은 넘지 못한다. 뒤의 둘은 방향만 같고 증거가 약하다는 뜻이다.
    #
    # 둘째, 넣고 돌린 수율이 더 높다. 넣고 676회에 6.7%(95% 구간 5.0%에서 8.8%),
    # 비우고 649회에 4.6%(3.3%에서 6.5%)였다. 두 비율 검정의 p는 0.109라 이 비교
    # 하나만으로는 확정할 수 없다. 전체 수율은 네 구간이 모두 성공해야 올라가는 합성
    # 값이라 잡음이 크기 때문이다. 짝 단위로 본 위의 증거가 더 직접적이다.
    #
    # 한 가지 분명히 해 둔다. 기준을 20회로 두면 안 된다. 성공률 4.3%에서는 20회 연속
    # 실패가 39%의 확률로 그냥 일어나고, 짝 48개 중 열다섯 개쯤이 "성공 0편"으로 보인다.
    # 실제로 그 기준으로 뽑은 14개 짝을 넣고 812회를 시도했더니 5.5%로 p가 0.43이었다.
    # 지금의 68회 기준은 (1-p)의 n제곱이 5% 아래로 내려가는 지점에서 나온 값이고,
    # 도구가 기록의 성공률을 보고 매번 다시 계산한다.
    deny:
      0: [2, 3]
      1: [4]
      2: [1, 7, 9]
      3: [3]

convert:
  # 변환 단계는 관절 각도에서 손끝 자세를 계산하는 데만 시뮬레이터를 쓴다.
  # 로봇은 태스크와 무관하게 같은 FR3라 장면을 따로 만들 필요가 없다.
  # 그래서 태스크 이름과 등록 모듈은 여기에 적지 않는다.
  # 계약 형식에 자세를 기록할 강체다. 시연 파일의 states/rigid_object/<이름>/root_pose에서
  # 읽는다. 큐브 쌓기는 큐브 세 개를 모두 기록한다.
  object_states: [cube_1, cube_2, cube_3]

render:
  # 비우면 렌더가 자기 기본 환경을 쓴다. 큐브는 그것이 맞다.
  task_id: ""
  register_modules: []
  cameras: [third_person_0, third_person_1, wrist]
  overlay_yaml: fr3_camera_overlay_v2/overlay.yaml
  binding_yaml: fr3_binding_v2.yaml
  success:
    # 재생하며 다시 매기는 판정. 세 큐브가 탑으로 서고 그리퍼를 놓았는지 본다.
    # 렌더가 마지막 기록 상태만 보고 매긴다. 함수는 물체 자세와 손가락 관절을 받아
    # 성공 여부와 함께 적을 항목(쌓인 순서)을 돌려준다.
    module: success_criteria
    function: replay_verdict
    verdict_attr: replay_success_any_order

physics:
  # assets 아래의 표준 번들 디렉터리. tools/normalize_physics_bundle.py가 만든 것이다.
  bundle_dir: fr3_cube_system_calibration_bundle_v1
  # 물리를 적용할 주된 물체들과 그것이 놓인 작업면.
  primary_objects: [cube_1, cube_2, cube_3]
  surface: work_surface
  # 이 환경의 팔 액추에이터 묶음 이름은 a1이다(1번부터 4번 관절). 번들 문서의
  # 기본값 arm과 다르므로 여기서 바로잡아 적는다.
  arm_actuator: a1
  gripper_actuator: gripper
  # 실측 질량. 물체마다 다르므로 번들의 공통 질량 대신 이 표를 쓴다.
  object_masses_kg:
    cube_1: 0.0633333333
    cube_2: 0.0650333333
    cube_3: 0.0660333333
  object_size_m: 0.0507

visual:
  package_dir: fr3_visual_randomization_v1
  # 시각 랜덤화 규격의 물체 이름과 이 장면의 물체를 잇는다.
  object_prims:
    cube_1: cube_1
    cube_2: cube_2
    cube_3: cube_3
    table: work_surface

dataset:
  task_string: Stack three cubes into a three-level tower
  robot_type: franka_fr3_osc
  # 최종 데이터셋의 초당 프레임 수. 이 값 하나가 파이프라인 전체를 결정한다.
  # 변환 단계가 손끝 궤적을 이 주기로 다시 뽑고, 렌더가 원본에서 몇 스텝에 하나씩
  # 뽑을지를 source_hz 나누기 hz로 정하며, 기록 단계가 이 값을 데이터셋에 적는다.
  # 환경변수 DATASET_HZ로 덮어쓸 수 있다.
  hz: 10
  # 생성 결과가 기록된 초당 스텝 수. 물리 주기 0.01초에 데시메이션 5이므로 20이다.
  # 환경변수 SOURCE_HZ로 덮어쓸 수 있다. source_hz를 hz로 나눈 값이 정수여야 한다.
  source_hz: 20
  schema_prefix: fr3_cube.hf80k

assets:
  required:
    - fwd_annotated.hdf5
    - fr3_cube_system_calibration_bundle_v1
    - fr3_visual_randomization_v1
