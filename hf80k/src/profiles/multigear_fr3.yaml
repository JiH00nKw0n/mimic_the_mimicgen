# FR3가 기어 세 개를 받침의 축에 차례로 끼우는 태스크.
#
# 핀 꽂기 프로필과 다른 곳만 보면 된다. 태스크 이름, 소스 데모, 환경 모듈, 구간 개수,
# 장면 물체 이름이 다르다. 파이프라인 단계는 같다.
#
# 이 프로필은 수율을 처음 재기 위한 것이다. 두 가지를 일부러 빼 두었다.
# 실측 물리 묶음이 없어서 physics 절을 비웠고, 기어 장면의 카메라 캘리브레이션이 없어서
# render 절을 비웠다. 그래서 여기서 나오는 수율은 손대지 않은 기본 물리에서 잰 값이고,
# 결과 데이터셋에는 영상이 들어가지 않는다.
schema_version: fr3.hf80k.task_profile.v1
id: multigear_fr3

generate:
  task_id: Isaac-MultiGear-LabFR3-IK-Rel-Mimic-v0
  register_modules: [gear_register, gear_success_hook, provenance_hooks]
  module_dir: env_gear
  # tools/multigear_to_mimic.py가 만든 파일이다. 받은 시연 20편을 초당 20스텝으로 줄이고
  # 손끝 상대 명령으로 바꾸고 구간 신호 다섯 개를 붙인 것이다.
  source_hdf5: multigear_annotated.hdf5
  source_yield_json: ""
  # IK 상대 제어에서 한 스텝에 허용하는 이동량의 배율. 기어 시연의 한 스텝 이동량이
  # 평균 2.9 mm, 최대 15.3 mm로 핀 꽂기의 13.6 mm와 비슷해서 같은 1.0을 쓴다.
  arm_scale: "1.0"
  # 구간 경계를 뒤로 옮길 범위, 스텝. 한 구간이 90스텝에서 280스텝이라 핀 꽂기와 같은
  # 값을 쓸 수 있다. 꽂는 구간에는 이 범위를 주지 않는다. 축 오차 1 mm를 요구하는
  # 구간이라 경계를 밀면 이미 앉은 기어를 다시 건드리는 궤적이 섞인다. 그 처리는
  # gear_mimic_cfg의 _apply_subtask_schema가 한다.
  subtask_offsets: "10,20"
  # 매 스텝 명령에 더하는 잡음. 0이면 넣지 않는다.
  #
  # 핀 꽂기에서 잡음 0.03이 성공을 0/697로 만들었다. 틈이 0.7 mm인 삽입에서 잡음이
  # 그보다 훨씬 커서다. 기어는 성공 판정이 축 오차 1 mm 안쪽을 요구해 핀보다 더
  # 빡빡하므로 처음부터 0으로 둔다. 올릴 이유가 생기면 재 보고 올린다.
  action_noise: 0.0

  # 소스 시연을 고르는 방식. 기본으로 켜져 있고 환경변수 HEURISTIC_SELECTION=0으로 끈다.
  heuristic_selection:
    enable: true
    # 하위 작업마다 소스를 다시 고른다. 기어는 구간이 여섯 개라 이 효과가 핀 꽂기보다
    # 클 수도 작을 수도 있다. 핀 꽂기에서는 구간을 섞으면 성공률이 떨어졌다. 아직 재지
    # 않았으므로 켠 상태와 끈 상태를 둘 다 재서 비교해야 한다.
    per_subtask: true
    tie_break: shuffle
    # {하위 작업 번호: [뺄 소스 번호]}. 아직 아무것도 재지 않았으므로 비워 둔다.
    # 재기 전에 채우면 안 된다. 핀 꽂기에서 성공률이 낮은 태스크에 고정 기준을 쓰면
    # 우연히 성공이 0인 짝을 대량으로 빼게 되는 것을 확인했다. 기준은 전체 성공률에서
    # 계산해야 하고 tools/source_routing_report.py가 그 계산을 한다.
    deny: {}

  extra_env:
    LAB_GEAR_TABLE_USD: /opt/hf80k/assets/legacy_multi_gear/assets/lab/table_scene.usdc
    LAB_GEAR_ASSET_ROOT: /opt/hf80k/assets/legacy_multi_gear/assets/gears

  # 이 태스크에는 sart 절이 없다. 일부러 없는 것이다. SART 증강은 태스크 프로필이 켜 줄
  # 때만 도는 선택 단계다. 빈 절이라도 적어 두면 실행 전 검사가 "SART를 켰는데 설정이
  # 없다"로 판단해 실행을 막는다.

convert:
  # 변환 단계는 관절 각도에서 손끝 자세를 계산하는 데만 시뮬레이터를 쓴다. 로봇은
  # 태스크와 무관하게 같은 FR3라 장면을 따로 만들 필요가 없다.
  #
  # 계약 형식에 자세를 기록할 강체 넷이다. 받침은 움직이지 않지만 자리가 에피소드마다
  # 달라지므로 적어야 한다. 받침 자세를 모르면 기어가 어디에 꽂혔는지 알 수 없다.
  object_states: [base, large, small, medium]

render:
  # 렌더를 켜면 생성된 궤적을 다시 재생하면서 카메라 세 대의 그림을 그려 넣는다. 이 절의
  # 기본값은 끈 상태다. 수율만 재는 실행에서 렌더까지 돌면 몇 배 느려지기 때문이다.
  # 영상이 필요한 실행에서만 환경변수 RENDER_ENABLE=1을 주어 켠다.
  enable: false
  # 생성과 같은 태스크를 쓴다. 렌더는 같은 장면을 카메라만 켜서 다시 재생하는 것이다.
  task_id: Isaac-MultiGear-LabFR3-IK-Rel-Mimic-v0
  register_modules: [gear_register]
  cameras: [third_person_0, third_person_1, wrist]
  # 카메라 보정값. 큐브 쌓기와 핀 꽂기가 쓰는 것과 같은 파일이다. 이 파일은 카메라 위치를
  # 로봇 밑동(fr3_link0) 기준으로 적고 그 변환이 단위행렬이라, 로봇 밑동이 장면에서 같은
  # 자리에 있으면 그대로 옮겨진다.
  #
  # 이 보정값을 기어 장면에 그대로 써도 되는지 확인했다. 두 장면의 로봇 받침 자리가
  # (0.72, 0.138, 0.722)으로 소수점까지 같고 z축 180도 회전도 같다. 작업면 높이도 둘 다
  # 0.720이다. 카메라 자리가 로봇 받침 기준으로 적혀 있으므로 그대로 옮겨진다.
  # 근거는 src/env_gear/gear_mimic_cfg.py의 ROBOT_POS와 DESK_Z, 그리고
  # src/env_peg/peg_mimic_cfg.py의 ROBOT_POS, src/render/peg_success_criteria.py의 DESK_Z다.
  #
  # 다만 책상 USD 파일은 서로 다르다. 기어 장면은
  # legacy_multi_gear/assets/lab/table_scene.usdc를 쓴다. 높이와 로봇 자리는 같으므로
  # 카메라 시점은 맞고, 책상의 겉모습만 실물과 다르게 보일 수 있다.
  overlay_yaml: fr3_camera_overlay_v2/overlay.yaml
  binding_yaml: fr3_binding_v2.yaml
  success:
    # 조립 판정. 기어 세 개가 모두 제 축에 앉아 있어야 성공이다. 축 중심이 받침 축에서
    # 가로세로 1 mm 안, 기어 원점과 받침 원점의 높이 차이 2.5 mm 안, 기울기 0.12 rad
    # 안이고 그리퍼가 열려 있어야 한다. 생성 중 판정과 같은 기준이며 속도 조건만 빠진다.
    # 계약 형식에 속도가 기록되지 않기 때문이고, 속도는 생성 단계에서 이미 걸러진 뒤다.
    module: gear_success_criteria
    function: replay_verdict
    verdict_attr: replay_success_any_order
physics:
  # 기어를 재서 얻은 실측 물리 묶음이 아직 없다. 핀 꽂기는
  # fr3_peg_in_hole_physics_bundle_v1_normalized를 쓰지만 기어용은 만들어지지 않았다.
  # 그래서 이 절을 비워 두고 손대지 않은 기본 물리로 돌린다. PHYSICS_PROFILE=off를
  # 환경변수로 같이 주어야 한다.
  bundle_dir: ""

visual:
  # 시각 랜덤화 규격은 물체를 큐브 쌓기 장면의 이름으로 부른다. 이 장면의 프림 경로로
  # 잇는다. {ENV}는 렌더가 환경 하나의 경로로 바꿔 넣는다.
  #
  # 기어 받침에 해당하는 자리가 규격에 없어서 받침은 겉모습이 랜덤화되지 않는다. 받침은
  # 매 에피소드 놓이는 자리가 달라지므로 겉모습까지 바꿀 이유가 크지 않다.
  package_dir: fr3_visual_randomization_v1
  object_prims:
    cube_1: "{ENV}/LargeGear"
    cube_2: "{ENV}/SmallGear"
    cube_3: "{ENV}/MediumGear"
    table: "{ENV}/LabTableVisual"
dataset:
  task_string: Assemble the three gears onto the base shafts in order large, small, medium
  robot_type: franka_fr3_osc
  # 최종 데이터셋의 초당 프레임 수. 변환 단계가 손끝 궤적을 이 주기로 다시 뽑는다.
  hz: 10
  # 생성 결과가 기록된 초당 스텝 수. 물리 주기 0.01초에 데시메이션 5이므로 20이다.
  # source_hz를 hz로 나눈 값이 정수여야 한다.
  source_hz: 20
  schema_prefix: fr3_multigear.hf80k

assets:
  required:
    - multigear_annotated.hdf5
    - legacy_multi_gear
