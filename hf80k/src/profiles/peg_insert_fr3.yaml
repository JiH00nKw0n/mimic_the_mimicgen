# FR3가 핀을 구멍에 꽂는 태스크.
#
# 큐브 프로필과 다른 곳만 보면 된다. 태스크 이름, 소스 데모, 환경 모듈, 성공 판정,
# 장면 물체 이름, 그리퍼 액추에이터 묶음 이름이 다르다. 파이프라인 다섯 단계는 같다.
schema_version: fr3.hf80k.task_profile.v1
id: peg_insert_fr3

generate:
  task_id: Isaac-PegInsert-LabFR3-IK-Rel-Mimic-v0
  # 큐브의 clean_success_hook은 cube_1부터 cube_3을 이름으로 찾으므로 여기서는 쓸 수 없다.
  # peg용 판정 훅을 쓴다.
  register_modules: [peg_register, peg_success_hook, provenance_hooks]
  module_dir: env_peg
  source_hdf5: peg_annotated.hdf5
  source_yield_json: ""
  # IK 상대 제어에서 한 스텝에 허용하는 이동량의 배율이다. 큐브는 0.5로 충분하지만
  # 핀은 집은 자리에서 구멍까지 최대 25 cm를 옮겨야 해서 1.0이 필요하다.
  arm_scale: "1.0"
  # peg는 2구간이다. 핀을 집고, 구멍에 넣는다. 경계가 하나뿐이라 범위도 하나만 적는다.
  subtask_offsets: "10,20"
  # 매 스텝 행동에 더하는 잡음의 크기다. 0이면 넣지 않는다.
  #
  # 큐브는 0.03을 쓴다. 잡음이 있어야 같은 시연에서 서로 다른 궤적이 나오기 때문이다.
  # 핀 꽂기에서는 그 값이 성공을 0으로 만든다. 핀과 구멍의 틈이 0.7 mm인데 잡음이
  # 그보다 훨씬 커서, 핀이 구멍 축에서 1.6 mm까지 다가가고도 23도 기울어진 채
  # 테두리에 걸렸다. 실제로 잰 값은 이렇다.
  #   잡음 0.03  성공 0/697
  #   잡음 0.01  성공 0/40
  #   잡음 0.0   성공 나옴 (아래 보간 스텝과 함께)
  action_noise: 0.0
  # 구간이 바뀔 때 손을 다음 구간의 시작 자세까지 몇 스텝에 걸쳐 옮길지는 여기서 정하지
  # 않는다. 5스텝과 25스텝을 40회씩 비교했더니 5스텝이 46.2%(18/39), 25스텝이
  # 34.4%(11/32)로 오히려 5스텝이 나았고, 이 정도 횟수에서는 두 값의 차이를 우연과
  # 구분할 수 없다. 값을 적지 않으면 환경 모듈의 기본값 5가 그대로 쓰인다.
  # SART 증강. 이 태스크는 켠다.
  #
  # SART(Self-Augmented Robot Trajectory)는 성공한 궤적 한 편에서 여러 편을 스스로 만들어
  # 내는 증강이다. 핀을 구멍 바로 위까지 가져온 순간의 손 자세를 하나 정해 두고, 그
  # 자세 주변의 공 모양 영역에서 손 자세를 하나 뽑아, 거기서 출발해 원래 자세로 한 방향
  # 으로 되돌아오게 만든다. 앞의 이송 구간과 뒤의 삽입 구간은 원본을 그대로 재생하므로
  # 접근 경로만 달라진다. 생성과 변환 사이에 한 단계로 들어간다.
  #
  # 큐브 쌓기 프로필에는 이 절이 아예 없고, 그래서 큐브는 SART를 돌지 않는다.
  sart:
    # 이 태스크가 SART 단계를 돌지 여부. 환경변수 SART_ENABLE=0을 주면 이 값과 무관하게
    # 꺼진다.
    enable: true
    # 소스 한 편당 몇 번 시도할지. RoboManipAug 원본의 num_sphere_sample에 해당한다.
    samples_per_source: 4
    # 접근 자세를 뽑는 공의 반지름, 미터. RoboManipAug 원본의 overwrite_radius다.
    # 0.06은 robosuite Square에서 60번 시도해 33번 성공(55.0%)한 실행이 쓴 값이다.
    radius_m: 0.06
    # 손 방향을 바꾸는 최대 각도, 도. 무작위로 고른 축을 기준으로 -10도에서 +10도
    # 사이에서 고르게 뽑고, 손 자신의 좌표계에 적용한다.
    rotation_deg: 10.0
    # 참이면 위치를 수렴 자세 그대로 두고 방향만 바꾼다. RoboManipAug 원본의
    # position_fix와 같은 뜻이다. 위 55.0%를 측정한 실행은 이 값이 거짓이었다.
    fix_position: false
    # 원본 이송 구간의 끝에서 뽑은 자세까지 몇 스텝에 걸쳐 벗어날지.
    # FR3는 한 스텝에 넣는 명령이 위치 변화량이고 -1에서 1로 잘린다. 6 cm를 너무 적은
    # 스텝에 나누면 명령이 잘려서 실제로는 그만큼 못 간다. 그래서 이 값이 중요하다.
    divert_steps: 10
    # 뽑은 자세에서 수렴 자세로 되돌아오는 스텝 수다. 동시에 원본 접근 구간에서 버리는
    # 스텝 수이기도 하다. 20은 위 55.0%를 측정한 실행이 쓴 값이다.
    converge_steps: 20
    # 수렴 자세에 머무르는 스텝 수. 제어기가 명령을 뒤따라오므로, 여기서 멈춰 줘야
    # 원본 삽입 구간이 시작될 때 손이 실제로 그 자세에 있다.
    settle_steps: 5
    # 에피소드 끝에서 삽입 구간으로 보는 스텝 수. 아래 규칙이 수렴 시점을 못 찾았을 때
    # 쓰는 대체값이기도 하다.
    tail_steps: 25
    # 수렴 시점을 고르는 규칙. radial_gate, descent_onset, tail_offset 중 하나다.
    # radial_gate는 핀을 쥔 뒤 핀 중심이 구멍 축에서 아래 converge_radius_m 안으로
    # 들어오는 첫 스텝을 고른다. 태스크가 스스로 정한 공차를 쓰므로 에피소드 길이가
    # 달라져도 값이 흔들리지 않는다. descent_onset은 robosuite Square에서 측정한
    # 규칙인데, 그 태스크는 움직이는 물체와 고정 목표가 여기와 반대다.
    # 실행기는 세 규칙을 모두 계산해 보고서에 적으므로, 시범 실행 한 번이면 어느 것이
    # 맞는지 눈으로 확인할 수 있다.
    converge_rule: radial_gate
    # 옮기는 물체 이름. 생성 파일의 states/rigid_object 아래 이름과 같아야 한다.
    converge_object: peg
    # 고정 목표 좌표계 이름. 환경의 get_object_poses가 이 이름으로 돌려준다. 좌표를
    # 여기 적지 않는 이유는, 적어 두면 환경의 기하가 바뀔 때 이 파일만 옛 값으로
    # 남기 때문이다. 이 좌표계의 높이가 아래 바닥면의 기준이기도 하다.
    converge_target: socket
    # 핀 중심이 구멍 축에서 이만큼 안으로 들어오면 구멍 위에 왔다고 본다, 미터.
    # 0.016은 32 mm 사각 구멍 안지름의 절반이고, peg_mdp.py의 RADIAL_INSIDE가 삽입
    # 깊이를 세기 시작하는 반경과 같은 값이다.
    converge_radius_m: 0.016
    # 고정 목표 위로 이만큼 띄운 높이가 공을 아래에서 자르는 면이 된다, 미터.
    # 뽑은 손 자세가 소켓 테두리 아래로 내려가지 않게 한다.
    floor_margin_m: 0.005
    # 두 손가락 관절의 평균 열림이 이 값 이하이면 쥐었다고 본다, 미터. 열린 값이
    # 0.04라서 0.035는 닫히기 시작하는 지점이다. 생성 파일에는 구간 경계 표시가
    # 남지 않으므로 관절 각도에서 다시 계산한다.
    grip_closed_m: 0.035
    # 청크 할당량 중 MimicGen에 요청할 비율. 0.5이고 청크가 500편이면 생성에 250편을
    # 요청하고 SART가 나머지 250편을 채운 뒤 멈춘다. 1.0으로 두면 생성이 할당량을 다
    # 만들고 SART가 그 위에 더하므로 청크가 할당량을 넘긴다.
    source_frac: 0.5
    # SART가 실패했을 때 무엇을 할지. continue면 이유를 로그에 적고 MimicGen 편만으로
    # 청크를 끝낸다. fail이면 청크를 실패로 처리한다.
    on_failure: continue
    # 연달아 이만큼 시도가 예외로 죽으면 증강을 멈추고 지금까지 만든 것을 지킨다.
    max_consecutive_failures: 3
    # 접근 자세를 뽑는 난수 시드에 더하는 값. 장면 무작위화에 쓰는 난수와 겹치지 않게
    # 하고, 같은 청크를 다시 돌리면 같은 자세가 나오게 한다.
    seed_offset: 7717
  extra_env:
    LAB_PEG_ENV_USD: /opt/hf80k/assets/peg_hole_env.usd
    LAB_PEG_HOLE_USD: /opt/hf80k/assets/hole_01.usd

convert:
  # 변환 단계는 관절 각도에서 손끝 자세를 계산하는 데만 시뮬레이터를 쓴다.
  # 로봇은 태스크와 무관하게 같은 FR3라 장면을 따로 만들 필요가 없다.
  # 그래서 태스크 이름과 등록 모듈은 여기에 적지 않는다.
  # 계약 형식에 자세를 기록할 강체다. 핀 삽입에서 움직이는 물체는 핀 하나뿐이다.
  # 구멍은 움직이지 않는 정적 물체라 강체 목록에 없고, 그래서 여기에 적을 수 없다.
  object_states: [peg]

render:
  # 렌더는 기본 환경이 큐브 장면이므로 peg에서는 태스크를 명시해야 한다.
  task_id: Isaac-PegInsert-LabFR3-IK-Rel-Mimic-v0
  register_modules: [peg_register]
  cameras: [third_person_0, third_person_1, wrist]
  overlay_yaml: fr3_camera_overlay_v2/overlay.yaml
  binding_yaml: fr3_binding_v2.yaml
  success:
    # 삽입 판정. 핀 중심이 구멍 축에서 1 cm 안, 깊이 2 cm 이상, 수직도 0.9 이상이다.
    # 렌더가 궤적을 다시 재생한 뒤 마지막 기록 상태만 보고 매긴다. 함수는 물체 자세와
    # 손가락 관절을 받아 성공 여부와 함께 적을 항목을 돌려준다.
    module: peg_success_criteria
    function: replay_verdict
    verdict_attr: replay_success_any_order

physics:
  bundle_dir: fr3_peg_in_hole_physics_bundle_v1_normalized
  primary_objects: [peg]
  # 구멍은 고정된 정적 물체라 물리 재질을 줄 대상이 아니다. 데스크가 작업면이다.
  surface: desk_surface
  arm_actuator: a1
  # peg 환경은 그리퍼 액추에이터 묶음 이름이 "h"다. 큐브는 "gripper"다.
  gripper_actuator: h
  object_masses_kg:
    peg: 0.0636
  # 핀은 정육면체가 아니지만 관성 계산에 쓰는 대표 변 길이다.
  object_size_m: 0.02

visual:
  package_dir: fr3_visual_randomization_v1
  # 시각 랜덤화 규격은 물체를 큐브 쌓기 장면의 이름으로 부른다. 이 장면의 프림 경로로
  # 잇는다. {ENV}는 렌더가 환경 하나의 경로로 바꿔 넣는다.
  #
  # cube_1 자리에 핀이 있고, cube_2와 cube_3은 이 장면에 없다. 값이 빈 문자열이면
  # 없는 물체라는 뜻이고, 없는 물체는 매 에피소드 건너뛴 항목으로 기록된다.
  # table은 큐브 장면과 같은 프림 이름이라 적지 않아도 그대로 맞는다.
  object_prims:
    cube_1: "{ENV}/Peg"
    cube_2: ""
    cube_3: ""

dataset:
  task_string: Insert the peg into the hole
  robot_type: franka_fr3_osc
  fps: 10
  schema_prefix: fr3_peg.hf80k

assets:
  required:
    - peg_annotated.hdf5
    - fr3_peg_in_hole_physics_bundle_v1_normalized
    - fr3_visual_randomization_v1
    - peg_hole_env.usd
    - hole_01.usd
