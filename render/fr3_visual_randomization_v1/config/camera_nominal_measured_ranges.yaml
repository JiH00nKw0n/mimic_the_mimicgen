schema_version: stage2.fr3_camera_nominal_measured_ranges.v2
status: measured_team_handoff
description: >
  FR3 camera nominal calibration and measured uncertainty envelopes. The
  executable ranges below come only from this installation's repeated
  measurements or bounded overlay refinement. They are not copied from a
  paper and are not Bayesian credible intervals.

conventions:
  matrix: column_vectors_p_parent_equals_parent_T_child_times_p_child
  optical_frame: RealSense_OpenCV_X_right_Y_down_Z_forward
  length: meter
  angle: degree
  intrinsics: pixel
  pose_delta:
    translation: uniform_ball_volume_in_parent_frame
    rotation: uniform_rotation_vector_ball_in_parent_frame
  sampling: once_per_environment_or_episode_and_constant_across_frame_history

