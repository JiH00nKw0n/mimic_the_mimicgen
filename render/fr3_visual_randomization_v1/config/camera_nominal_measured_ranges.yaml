measured_ranges:
  camera_local:
    fixed_d435:
      evidence: maximum_deviation_across_repeated_extrinsic_estimates
      intrinsics:
        enabled: false
        reason: no_repeated_intrinsic_scatter_dataset
      by_role:
        third_person_0:
          translation_uniform_ball_radius_m: 0.003682735487551472
          rotation_uniform_vector_ball_radius_deg: 0.19621075853334857
        third_person_1:
          translation_uniform_ball_radius_m: 0.0016704980944186392
          rotation_uniform_vector_ball_radius_deg: 0.0791470705099882
        third_person_2:
          translation_uniform_ball_radius_m: 0.000684424686240364
          rotation_uniform_vector_ball_radius_deg: 0.03355944094726284
    wrist_d405:
      evidence: handeye_to_selected_overlay_correction_and_intrinsic_refinement
      translation_uniform_ball_radius_m: 0.003
      rotation_uniform_vector_ball_radius_deg: 0.172077
      focal_length_scale_uniform: [0.994441, 1.005559]
      principal_point_delta_uniform_px:
        x: [-4.427169, 4.427169]
        y: [-0.960071, 0.960071]
      note: >
        These bounds use the observed correction magnitude as a residual-error
        envelope. They do not estimate repeated rigid-mount reinstall scatter.

  common_registration:
    enabled_by_default: false
    evidence: measured_board_placement_and_base_table_registration_uncertainty
    applies_coherently_to:
      - fixed_camera_parent_frame
      - table_and_task_geometry
    translation_uniform_ball_radius_m: 0.003
    rotation_uniform_vector_ball_radius_deg: 1.0
    note: >
      Enable this component only when the base-to-table registration is also
      uncertain. Do not independently perturb each fixed camera with it.

evidence_summary:
  fixed_d435_repeated_extrinsic_scatter:
    third_person_0:
      maximum_translation_deviation_m: 0.003682735487551472
      maximum_rotation_deviation_deg: 0.19621075853334857
    third_person_1:
      maximum_translation_deviation_m: 0.0016704980944186392
      maximum_rotation_deviation_deg: 0.0791470705099882
    third_person_2:
      maximum_translation_deviation_m: 0.000684424686240364
      maximum_rotation_deviation_deg: 0.03355944094726284
  wrist_d405_refinement:
    fit_pose_count: 12
    independent_holdout_pose_count: 5
    selected_holdout_rmse_px: 1.196785
    selected_holdout_p95_px: 1.909555
    correction_from_handeye_translation_m: 0.003
    correction_from_handeye_rotation_deg: 0.172077
    factory_to_selected_intrinsics:
      fx_fraction: -0.005559
      fy_fraction: -0.004318
      ppx_delta_px: 4.427169
      ppy_delta_px: 0.960071

usage_profiles:
  nominal:
    camera_local_randomization: false
    common_registration_randomization: false
    purpose: deterministic_overlay_regression_and_reporting
  measured_camera_local:
    camera_local_randomization: true
    common_registration_randomization: false
    purpose: camera_installation_robustness
  measured_camera_plus_registration:
    camera_local_randomization: true
    common_registration_randomization: true
    purpose: camera_and_task_frame_robustness

sampling_policy:
  distribution_is_an_example_not_a_training_requirement: true
  sample_pose_in_parent_frame: true
  sample_once_per_episode: true
  keep_constant_across_temporal_observation_stack: true
  log_every_sample_with_episode_id: true
  always_report_nominal_separately: true
  prohibited:
    - per_frame_camera_pose_jitter
    - replacing_nominal_calibration_with_randomization
    - changing_wrist_camera_world_pose_without_following_hand_tcp
    - applying_common_registration_independently_to_each_fixed_camera

reference_principle:
  note: >
    Prior work, including OmniReset, motivates calibrating a nominal camera
    model first and randomizing only residual uncertainty. No paper-reported
    numeric camera range is used by this file.
